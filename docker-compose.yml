version: '3.8'

services:
  # 後端服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio-live-stream-backend
    ports:
      - "8000:8000"
    volumes:
      # 掛載上傳和輸出目錄，方便存取檔案
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
    environment:
      # 從 .env 檔案讀取環境變數
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-pro}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-524288000}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服務
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audio-live-stream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      # 設定 API URL（前端需要知道後端位置）
      - REACT_APP_API_URL=http://localhost:8000/api
    restart: unless-stopped
